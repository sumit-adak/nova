[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-assistant"
version = "0.1.0"
description = "NOVA — Personal AI Operating Layer for Windows 11"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NOVA Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "structlog>=24.1.0",
    "keyring>=24.3.0",
    "watchdog>=4.0.0",
    "psutil>=5.9.8",
    "PySide6>=6.6.0",
    "GitPython>=3.1.40",
    "openai>=1.12.0",
    "google-generativeai>=0.4.0",
    "SpeechRecognition>=3.10.1",
    "pyttsx3>=2.90",
    "PyAudio>=0.2.14",
    "PyAutoGUI>=0.9.54",
    "GPUtil>=1.4.0",
    "pycaw>=20240210",
    "comtypes>=1.2.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-qt>=4.4.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pyinstaller>=6.3.0"
]

[tool.setuptools.packages.find]
include = ["nova_app*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
